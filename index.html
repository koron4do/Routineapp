<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GYM LOG">
<meta name="theme-color" content="#0A0A0A">
<title>GYM LOG</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Bebas+Neue&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0A0A0A;color:#E8E8E8;font-family:'DM Mono','Courier New',monospace;overscroll-behavior:none}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:#2A2A2A}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
input[type=number]{-moz-appearance:textfield}
input::placeholder,textarea::placeholder{color:#3A3A3A}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:680px;margin:0 auto}
.hdr{padding:env(safe-area-inset-top,14px) 16px 10px;background:rgba(10,10,10,0.97);border-bottom:2px solid var(--cdim,#333);position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);flex-shrink:0}
.hdr-sub{font-size:9px;letter-spacing:4px;color:#333;margin-bottom:3px}
.hdr-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hdr-title{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:2px;line-height:1;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scroll{flex:1;overflow-y:auto;padding:14px 14px calc(env(safe-area-inset-bottom,16px) + 68px);-webkit-overflow-scrolling:touch}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:680px;margin:0 auto;background:rgba(10,10,10,0.97);border-top:1px solid #1A1A1A;display:flex;padding-bottom:env(safe-area-inset-bottom,0px);backdrop-filter:blur(14px);z-index:50}
.nav-btn{flex:1;padding:9px 0 11px;display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:transparent;cursor:pointer;transition:all .15s}
.nav-icon{font-size:17px;line-height:1}
.nav-lbl{font-size:7px;letter-spacing:2px;font-family:'DM Mono',monospace}
.slbl{font-size:9px;letter-spacing:3px;color:#333;margin-bottom:8px}
/* EX TABLE */
.ex-table{background:#111;border-radius:8px;border:1px solid #1A1A1A;overflow:hidden;margin-bottom:18px}
.ex-thead{display:grid;grid-template-columns:28px 1fr 34px 62px 52px 22px;padding:7px 10px;background:#0D0D0D;border-bottom:1px solid #1A1A1A}
.ex-thead span{font-size:7px;letter-spacing:3px;color:#2A2A2A}
.ex-row{display:grid;grid-template-columns:28px 1fr 34px 62px 52px 22px;padding:10px 10px;align-items:center;border-bottom:1px solid #1A1A1A;transition:background .12s}
.ex-row:last-child{border-bottom:none}
.ex-row.dragging{opacity:0.4;background:#1A1A1A}
.ex-row.drag-over{background:#1E2A1E;border-top:2px solid #34D399}
.drag-handle{cursor:grab;color:#2A2A2A;font-size:14px;display:flex;align-items:center;justify-content:center;padding:2px;user-select:none;-webkit-user-select:none;touch-action:none}
.drag-handle:active{cursor:grabbing;color:#555}
.ex-tag{font-size:7px;letter-spacing:1px;padding:1px 4px;border-radius:2px;flex-shrink:0}
.ex-name{font-size:11px;font-weight:500;color:#D8D8D8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex-sub{font-size:9px;color:#3A3A3A;line-height:1.3;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex-sets{font-size:15px;font-family:'Bebas Neue',sans-serif;letter-spacing:1px;text-align:center}
.ex-reps{font-size:9px;color:#777;line-height:1.2}
.kg-btn{border-radius:5px;padding:4px 2px;cursor:pointer;width:100%;text-align:center;transition:all .15s;border:none;line-height:1.2}
.kg-val{font-size:12px;font-family:'Bebas Neue',sans-serif;letter-spacing:1px;display:block}
.kg-sub{font-size:7px;letter-spacing:1px;font-family:'DM Mono',monospace;display:block;margin-top:1px}
.guide-arr{font-size:13px;text-align:center;cursor:pointer;padding:2px}
/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:100;display:flex;align-items:flex-end;animation:fi .18s ease}
.overlay-full{position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:200;display:flex;align-items:flex-end;animation:fi .18s ease}
.panel{width:100%;max-width:680px;margin:0 auto;background:#0F0F0F;border-radius:14px 14px 0 0;border:1px solid #2A2A2A;border-bottom:none;max-height:92dvh;overflow-y:auto;animation:su .22s ease}
.panel-full{width:100%;max-width:680px;margin:0 auto;background:#0A0A0A;border-radius:14px 14px 0 0;border:1px solid #2A2A2A;border-bottom:none;height:92dvh;display:flex;flex-direction:column;animation:su .22s ease}
.phdr{position:sticky;top:0;background:#0F0F0F;padding:13px 16px 11px;border-bottom:1px solid #1A1A1A;display:flex;justify-content:space-between;align-items:flex-start;z-index:10;flex-shrink:0}
.phdr-full{background:#0A0A0A;padding:13px 16px 11px;border-bottom:1px solid #1A1A1A;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.pbody{padding:14px 16px 36px;overflow-y:auto}
.pbody-full{padding:12px 14px;overflow-y:auto;flex:1}
.xbtn{background:#1A1A1A;border:none;color:#555;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.flbl{font-size:8px;letter-spacing:3px;color:#3A3A3A;margin-bottom:7px}
.kginput{width:100%;background:#161616;border:1px solid #2A2A2A;border-radius:6px;padding:11px;color:#FFF;font-size:30px;font-family:'Bebas Neue',sans-serif;letter-spacing:2px;outline:none;text-align:center}
.kginput:focus{border-color:#555}
.qbtns{display:flex;gap:4px;margin-top:6px}
.qbtn{flex:1;padding:7px 0;border-radius:4px;font-size:10px;font-family:'DM Mono',monospace;cursor:pointer;transition:all .15s;border:none}
.rpe-row{display:flex;gap:4px}
.rpebtn{flex:1;padding:9px 0;border-radius:5px;font-size:13px;font-family:'Bebas Neue',sans-serif;cursor:pointer;transition:all .15s;border:none}
.noteinput{width:100%;background:#161616;border:1px solid #1E1E1E;border-radius:6px;padding:11px 13px;color:#CCC;font-size:11px;font-family:'DM Mono',monospace;outline:none;resize:none;line-height:1.6}
.noteinput:focus{border-color:#3A3A3A}
.savebtn{width:100%;padding:13px;border-radius:6px;font-size:11px;letter-spacing:3px;font-family:'DM Mono',monospace;cursor:pointer;transition:all .2s;border:none}
.prevbox{border-radius:7px;padding:11px 13px;margin-bottom:14px;display:flex;gap:11px;align-items:flex-start}
/* SEARCH */
.searchbox{width:100%;background:#161616;border:1px solid #2A2A2A;border-radius:8px;padding:11px 14px;color:#E8E8E8;font-size:13px;font-family:'DM Mono',monospace;outline:none;margin-bottom:10px}
.searchbox:focus{border-color:#555}
/* DB EXERCISE CARDS */
.db-group{margin-bottom:16px}
.db-group-lbl{font-size:9px;letter-spacing:3px;color:#444;margin-bottom:7px;padding:4px 8px;background:#111;border-radius:4px;display:inline-block}
.db-ex-item{background:#111;border:1px solid #1A1A1A;border-radius:7px;padding:10px 12px;margin-bottom:5px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:all .15s}
.db-ex-item:active{transform:scale(0.98);background:#1A1A1A}
.db-ex-item.selected{border-color:#34D399;background:#0D1A14}
.db-ex-name{font-size:12px;color:#CCC;font-weight:500;flex:1}
.db-ex-muscle{font-size:9px;color:#555;letter-spacing:1px}
.db-ex-type{font-size:7px;padding:2px 5px;border-radius:2px;flex-shrink:0}
/* EDIT MODE */
.edit-ex-row{background:#111;border:1px solid #1A1A1A;border-radius:7px;padding:10px 12px;margin-bottom:6px;display:flex;align-items:center;gap:8px;transition:all .18s}
.edit-ex-row.dragging{opacity:0.3;background:#1A1A1A}
.edit-ex-row.drag-over{border-top:2px solid var(--accent,#34D399)}
/* FILTER PILLS */
.filter-row{display:flex;gap:5px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px;-webkit-overflow-scrolling:touch}
.filter-row::-webkit-scrollbar{display:none}
.fpill{padding:5px 10px;border-radius:20px;font-size:8px;letter-spacing:2px;font-family:'DM Mono',monospace;cursor:pointer;border:1px solid #2A2A2A;background:#161616;color:#666;white-space:nowrap;transition:all .15s;flex-shrink:0}
.fpill.active{background:#1E2A1E;color:#34D399;border-color:#34D39955}
/* STATS */
.stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:16px}
.stat-card{background:#111;border:1px solid #1A1A1A;border-radius:8px;padding:11px 8px;text-align:center}
.stat-val{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:2px;line-height:1}
.stat-lbl{font-size:7px;letter-spacing:2px;color:#555;margin-top:2px}
/* SESS GRID */
.sess-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.sess-card{border-radius:10px;padding:11px 8px;text-align:center;border:1px solid #1E1E1E;transition:all .18s}
.sess-count{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:2px;line-height:1;margin-bottom:1px}
.sess-label{font-size:8px;letter-spacing:2px;color:#555;margin-bottom:5px}
.sess-dots{display:flex;gap:3px;justify-content:center;flex-wrap:wrap;min-height:8px;margin-bottom:6px}
.sess-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
/* TIPS */
.tips-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tip-card{background:#111;border:1px solid #1A1A1A;border-radius:6px;padding:11px}
.empty{background:#111;border:1px solid #1A1A1A;border-radius:8px;padding:28px 16px;text-align:center}
.btn{cursor:pointer;border:none;transition:all .16s}
.nbanner{border-left:3px solid #555;border-radius:6px;padding:9px 12px;margin-bottom:12px;font-size:11px;color:#888;line-height:1.6;background:#111}
.steprow{border-left:2px solid #1E1E1E;padding-left:11px;margin-bottom:8px}
.steprow:last-child{margin-bottom:0}
.stepnum{width:18px;height:18px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;flex-shrink:0;margin-top:2px}
.mstag{padding:3px 8px;border-radius:3px;font-size:9px;letter-spacing:1px}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes su{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.pulsing{animation:pulse 1s infinite}
</style>
</head>

// ─── TIMER ────────────────────────────────────────────────────
function startTimer(p){
  clearInterval(S.timerInterval);
  S.timer={active:true,secs:p,preset:p};
  S.timerInterval=setInterval(()=>{
    if(S.timer.secs>0){S.timer.secs--;renderTimerOnly();}
    else{clearInterval(S.timerInterval);S.timer.active=false;S.timer.secs=0;renderTimerOnly();try{if(navigator.vibrate)navigator.vibrate([200,100,200]);}catch{}}
  },1000);
  renderTimerOnly();
}
function stopTimer(){clearInterval(S.timerInterval);S.timer.active=false;S.timer.secs=0;renderTimerOnly();}
function renderTimerOnly(){
  const el=document.getElementById("timer-disp");
  if(!el) return;
  const m=Math.floor(S.timer.secs/60),s=S.timer.secs%60;
  el.textContent=`${m}:${s.toString().padStart(2,"0")}`;
  const day=S.days[S.activeDay];
  el.style.color=S.timer.active?(S.timer.secs<=10?"#E84B2E":day.accent):"#444";
  if(S.timer.active)el.classList.add("pulsing");else el.classList.remove("pulsing");
}

// ─── SESSION ──────────────────────────────────────────────────
function addSession(dayId){
  const today=new Date().toISOString().split("T")[0];
  if(!S.sessions[dayId])S.sessions[dayId]=[];
  S.sessions[dayId].push(today);
  sv("gymsess_v1",S.sessions);render();
}
function removeLastSession(dayId){
  if(!S.sessions[dayId]||!S.sessions[dayId].length)return;
  if(!confirm("¿Borrar la última sesión registrada?"))return;
  S.sessions[dayId].pop();
  sv("gymsess_v1",S.sessions);render();
}
function calcStreak(){
  const all=Object.values(S.sessions).flat().map(d=>new Date(d)).sort((a,b)=>b-a);
  if(!all.length)return 0;
  let streak=0;const now=new Date();
  for(let w=0;w<52;w++){
    const ws=new Date(now);ws.setDate(now.getDate()-(w+1)*7);
    const we=new Date(now);we.setDate(now.getDate()-w*7);
    if(all.filter(d=>d>=ws&&d<we).length>=3)streak++;else break;
  }
  return streak;
}

// ─── LOG ACTIONS ──────────────────────────────────────────────
function openLog(dayId,exIdx){
  const day=S.days[dayId];
  const exId=day.exercises[exIdx];
  const ex=dbGet(exId);
  S.modal={type:"log",ex,exId,dayColor:day.color,dayAccent:day.accent};
  S.saved=false;render();
}
function openLogByDay(dayId,exIdx){openLog(dayId,exIdx);}
function openGuide(dayId,exIdx){
  const day=S.days[dayId];
  const ex=dbGet(day.exercises[exIdx]);
  if(!ex.guide||!GUIDES[ex.guide])return;
  S.modal={type:"guide",ex,dayColor:day.color,dayAccent:day.accent};render();
}
function switchToLog(){
  const m=S.modal;if(!m)return;
  S.modal={type:"log",ex:m.ex,exId:m.exId||m.ex.id,dayColor:m.dayColor,dayAccent:m.dayAccent};
  S.saved=false;render();
}
function closeModal(){S.modal=null;render();}

function adjustKg(delta){
  const inp=document.getElementById("kg-inp");if(!inp)return;
  const v=Math.max(0,(parseFloat(inp.value)||0)+delta);
  inp.value=v%1===0?v.toString():v.toFixed(2);
  if(S.modal)S.modal.kg=inp.value;
}
function setRpe(v){
  if(!S.modal)return;
  const cur=S.modal.rpe!==undefined?S.modal.rpe:(S.log[S.modal.ex.name]?.rpe||"");
  S.modal.rpe=cur===v?"":v;render();
}
function saveEntry(){
  const m=S.modal;if(!m)return;
  const inp=document.getElementById("kg-inp");
  const ni=document.getElementById("note-inp");
  const kg=inp?inp.value:(m.kg||"");
  const rpe=m.rpe!==undefined?m.rpe:(S.log[m.ex.name]?.rpe||"");
  const note=ni?ni.value:(m.note||"");
  const prev=S.log[m.ex.name];
  S.log[m.ex.name]={kg,rpe,note,prevKg:prev?.kg||null,date:new Date().toLocaleDateString("es-ES",{day:"2-digit",month:"2-digit",year:"2-digit"}),ts:Date.now()};
  sv("gymlog_v3",S.log);S.saved=true;render();
  setTimeout(()=>{S.modal=null;render();},900);
}
function clearEntry(name){
  if(!confirm(`¿Borrar registro de "${name}"?`))return;
  delete S.log[name];sv("gymlog_v3",S.log);render();
}

// Confirm replace
function confirmReplace(dbId){
  const day=S.days[S.replaceDayId];
  day.exercises[S.replaceIdx]=dbId;
  sv("gymdays_v1",S.days);
  S.modal=null;S.replaceDayId=null;S.replaceIdx=null;
  render();
}

// Remove exercise from routine
function removeExercise(dayId,exIdx){
  if(!confirm("¿Quitar este ejercicio de la rutina?"))return;
  S.days[dayId].exercises.splice(exIdx,1);
  sv("gymdays_v1",S.days);render();
}

// Add exercise from DB to a day
function addExerciseToDay(dayId,dbId){
  if(S.days[dayId].exercises.includes(dbId)){alert("Ya está en la rutina");return;}
  S.days[dayId].exercises.push(dbId);
  sv("gymdays_v1",S.days);
  S.modal=null;S.replaceDayId=null;S.replaceIdx=null;
  render();
}

// Move exercise up/down
function moveEx(dayId,exIdx,dir){
  const arr=S.days[dayId].exercises;
  const to=exIdx+dir;
  if(to<0||to>=arr.length)return;
  [arr[exIdx],arr[to]]=[arr[to],arr[exIdx]];
  sv("gymdays_v1",S.days);render();
}

// Reset day to default
function resetDay(dayId){
  if(!confirm("¿Restaurar el día a la rutina original?"))return;
  S.days[dayId].exercises=[...DEFAULT_DAYS[dayId].exercises];
  sv("gymdays_v1",S.days);render();
}

// ─── TOUCH DRAG FOR EDIT ROW ──────────────────────────────────
let touchDragIdx=null, touchDayId=null, touchStartY=0, ghostEl=null;
function onTouchStart(e,dayId,idx){
  touchDragIdx=idx; touchDayId=dayId;
  touchStartY=e.touches[0].clientY;
  e.currentTarget.style.opacity="0.4";
}
function onTouchMove(e){
  if(touchDragIdx===null)return;
  e.preventDefault();
  const y=e.touches[0].clientY;
  // find element under touch
  const els=document.querySelectorAll(".edit-ex-row");
  els.forEach(el=>el.classList.remove("drag-over"));
  const under=document.elementFromPoint(e.touches[0].clientX,y);
  const row=under?.closest(".edit-ex-row");
  if(row){
    const idx=parseInt(row.dataset.idx);
    if(!isNaN(idx)&&idx!==touchDragIdx)row.classList.add("drag-over");
  }
}
function onTouchEnd(e){
  if(touchDragIdx===null)return;
  const y=e.changedTouches[0].clientY;
  const under=document.elementFromPoint(e.changedTouches[0].clientX,y);
  const row=under?.closest(".edit-ex-row");
  if(row){
    const toIdx=parseInt(row.dataset.idx);
    if(!isNaN(toIdx)&&toIdx!==touchDragIdx){
      const arr=S.days[touchDayId].exercises;
      const [moved]=arr.splice(touchDragIdx,1);
      arr.splice(toIdx,0,moved);
      sv("gymdays_v1",S.days);
    }
  }
  document.querySelectorAll(".edit-ex-row").forEach(el=>{el.style.opacity="";el.classList.remove("drag-over");});
  touchDragIdx=null;touchDayId=null;render();
}

// ─── STATS VIEW ───────────────────────────────────────────────
function renderStats(){
  const streak=calcStreak();
  const total=Object.values(S.sessions).flat().length;
  const now=new Date();
  const wS=new Date(now);wS.setDate(now.getDate()-7);
  const thisWeek=Object.values(S.sessions).flat().filter(d=>new Date(d)>=wS).length;

  const allDates={};
  S.days.forEach(d=>(S.sessions[d.id]||[]).forEach(dt=>{allDates[dt]=allDates[dt]||[];allDates[dt].push(d.id);}));
  const calDays=[];
  for(let i=55;i>=0;i--){const d=new Date(now);d.setDate(now.getDate()-i);calDays.push({iso:d.toISOString().split("T")[0],dow:d.getDay(),s:allDates[d.toISOString().split("T")[0]]||[]});}
  const weeks=[];let wk=[];
  calDays.forEach((d,i)=>{wk.push(d);if(d.dow===6||i===calDays.length-1){weeks.push(wk);wk=[];}});

  return`
  <div class="stat-grid">
    ${[{v:total,l:"TOTAL",sub:"sesiones",c:"#F59E0B"},{v:streak,l:"RACHA",sub:"semanas",c:"#E84B2E"},{v:thisWeek,l:"ESTA SEM.",sub:"sesiones",c:"#059669"}].map(x=>`
    <div class="stat-card">
      <div class="stat-val" style="color:${x.c}">${x.v}</div>
      <div class="stat-lbl">${x.l}</div>
      <div style="font-size:8px;color:#3A3A3A">${x.sub}</div>
    </div>`).join("")}
  </div>

  <div class="slbl">SESIONES POR DÍA</div>
  <div class="sess-grid">
    ${S.days.map(d=>{
      const sess=S.sessions[d.id]||[];
      const last=sess.length?new Date(sess[sess.length-1]).toLocaleDateString("es-ES",{day:"2-digit",month:"2-digit"}):"—";
      return`<div class="sess-card" style="background:${d.color}0D;border-color:${d.color}33">
        <div class="sess-count" style="color:${d.accent}">${sess.length}</div>
        <div class="sess-label">${d.day}</div>
        <div style="font-size:8px;color:#3A3A3A;margin-bottom:5px">${d.label.split("·")[0].trim()}</div>
        <div class="sess-dots">${sess.slice(-18).map(()=>`<div class="sess-dot" style="background:${d.color}"></div>`).join("")}</div>
        <div style="font-size:8px;color:#444;margin-bottom:7px">ÚLT. ${last}</div>
        <div style="display:flex;gap:5px">
          <button class="btn" onclick="event.stopPropagation();addSession(${d.id})" style="flex:1;background:${d.color}22;border:1px solid ${d.color}44;border-radius:4px;padding:5px;color:${d.accent};font-size:13px">+</button>
          <button class="btn" onclick="event.stopPropagation();removeLastSession(${d.id})" style="flex:1;background:#161616;border:1px solid #2A2A2A;border-radius:4px;padding:5px;color:#444;font-size:13px">−</button>
        </div>
      </div>`;
    }).join("")}
  </div>

  <div class="slbl">ACTIVIDAD · ÚLTIMAS 8 SEMANAS</div>
  <div style="background:#111;border:1px solid #1A1A1A;border-radius:8px;padding:12px;overflow-x:auto">
    <div style="display:flex;gap:3px">
      ${weeks.map(wk=>`<div style="display:flex;flex-direction:column;gap:3px">
        ${wk.map(d=>{
          const bg=d.s.length>0?(d.s.length>1?"#ffffff33":S.days[d.s[0]]?.color+"99"):"#1A1A1A";
          return`<div title="${d.iso}" style="width:13px;height:13px;border-radius:3px;background:${bg};flex-shrink:0"></div>`;
        }).join("")}
      </div>`).join("")}
    </div>
    <div style="display:flex;gap:8px;margin-top:9px;flex-wrap:wrap">
      ${S.days.map(d=>`<div style="display:flex;align-items:center;gap:4px"><div style="width:9px;height:9px;border-radius:2px;background:${d.color}99"></div><span style="font-size:8px;color:#555">${d.day}</span></div>`).join("")}
    </div>
  </div>`;
}

// ─── DB VIEW ──────────────────────────────────────────────────
function renderDB(){
  const search=(S.dbSearch||"").toLowerCase();
  const filt=S.dbFilter;
  const filtered=DB.filter(e=>{
    const matchM=filt==="ALL"||e.muscle===filt;
    const matchS=!search||(e.name.toLowerCase().includes(search)||e.muscle.toLowerCase().includes(search));
    return matchM&&matchS;
  });
  const grouped={};
  filtered.forEach(e=>{if(!grouped[e.muscle])grouped[e.muscle]=[];grouped[e.muscle].push(e);});

  return`
  <input class="searchbox" id="db-search" type="text" placeholder="🔍  Buscar ejercicio..." oninput="dbSearchInput()" value="${S.dbSearch||""}">
  <div class="filter-row">
    <span class="fpill ${filt==="ALL"?"active":""}" onclick="setDbFilter('ALL')">TODOS</span>
    ${DB_MUSCLES.map(m=>`<span class="fpill ${filt===m?"active":""}" onclick="setDbFilter('${m}')">${m.toUpperCase()}</span>`).join("")}
  </div>
  <div style="font-size:9px;color:#3A3A3A;margin-bottom:10px;letter-spacing:2px">${filtered.length} EJERCICIOS${search?` · "${S.dbSearch}"`:""}${filt!=="ALL"?` · ${filt}`:""}</div>

  ${Object.keys(grouped).map(muscle=>`
    <div class="db-group">
      <div class="db-group-lbl">${muscle.toUpperCase()} · ${grouped[muscle].length}</div>
      ${grouped[muscle].map(ex=>{
        const tColor=ex.type==="compound"?"#FF6B4A":ex.type==="core"?"#777":"#3A8A8A";
        const tBg=ex.type==="compound"?"#E84B2E1A":ex.type==="core"?"#2A2A2A":"#0A3A3A";
        const inRoutine=S.days.some(d=>d.exercises.includes(ex.id));
        const hasG=ex.guide&&GUIDES[ex.guide];
        return`<div class="db-ex-item ${inRoutine?"selected":""}">
          <span class="db-ex-type" style="color:${tColor};background:${tBg}">${ex.type==="compound"?"COMP.":ex.type==="core"?"CORE":"AISLA."}</span>
          <div style="flex:1;min-width:0">
            <div class="db-ex-name">${ex.name}</div>
            <div class="db-ex-muscle">${ex.muscle} · ${ex.sets}×${ex.reps}</div>
          </div>
          ${inRoutine?`<span style="font-size:8px;color:#34D399;background:#0D1A14;border:1px solid #34D39944;padding:2px 6px;border-radius:3px;flex-shrink:0">EN RUTINA</span>`:""}
          ${hasG?`<button class="btn" onclick="openDbGuide('${ex.id}')" style="background:#161616;border:1px solid #252525;border-radius:4px;padding:4px 7px;color:#555;font-size:10px;flex-shrink:0">›</button>`:""}
        </div>`;
      }).join("")}
    </div>`).join("")}
  `;
}

// ─── MODAL DISPATCHER ─────────────────────────────────────────
function renderModal(){
  const m=S.modal;if(!m)return"";
  if(m.type==="log")return renderLogModal(m);
  if(m.type==="guide")return renderGuideModal(m);
  if(m.type==="replace")return renderReplaceModal();
  return"";
}

// ─── LOG MODAL ────────────────────────────────────────────────
function renderLogModal(m){
  const entry=S.log[m.ex.name]||{};
  const kg=m.kg!==undefined?m.kg:(entry.kg||"");
  const rpe=m.rpe!==undefined?m.rpe:(entry.rpe||"");
  const note=m.note!==undefined?m.note:(entry.note||"");
  const hasPrev=!!(entry.kg||entry.note);
  return`<div class="overlay">
    <div class="panel" style="border-color:${m.dayColor}44">
      <div class="phdr">
        <div>
          <div style="font-size:8px;letter-spacing:3px;color:#3A3A3A;margin-bottom:2px">REGISTRAR</div>
          <div style="font-family:'Bebas Neue',sans-serif;font-size:19px;color:${m.dayAccent};letter-spacing:1px;line-height:1">${m.ex.name}</div>
          <div style="font-size:9px;color:#444;margin-top:2px">${m.ex.sets} series · ${m.ex.reps}</div>
        </div>
        <button class="xbtn" onclick="closeModal()">×</button>
      </div>
      <div class="pbody">
        ${hasPrev?`<div class="prevbox" style="background:${m.dayColor}12;border:1px solid ${m.dayColor}30">
          <div style="font-size:16px;flex-shrink:0">📋</div>
          <div style="min-width:0">
            <div style="font-size:8px;letter-spacing:2px;color:#3A3A3A;margin-bottom:3px">ÚLTIMO · ${entry.date||"—"}</div>
            <div style="display:flex;gap:8px;align-items:center">
              ${entry.kg?`<span style="font-size:14px;font-family:'Bebas Neue',sans-serif;color:${m.dayAccent}">${entry.kg} KG</span>`:""}
              ${entry.rpe?`<span style="font-size:10px;color:#777">RPE ${entry.rpe}</span>`:""}
            </div>
            ${entry.note?`<div style="font-size:10px;color:#666;margin-top:2px;line-height:1.4">${entry.note}</div>`:""}
          </div>
        </div>`:""}
        <div style="margin-bottom:12px">
          <div class="flbl">CARGA (KG)</div>
          <input class="kginput" id="kg-inp" type="number" value="${kg}" placeholder="0">
          <div class="qbtns">${[-5,-2.5,-1.25,1.25,2.5,5].map(d=>`<button class="qbtn btn" onclick="adjustKg(${d})" style="background:${d>0?"#1A2A1A":"#1A1A2A"};color:${d>0?"#4A9A4A":"#5A5A9A"};border:1px solid ${d>0?"#2A4A2A":"#2A2A4A"}">${d>0?"+"+d:d}</button>`).join("")}</div>
        </div>
        <div style="margin-bottom:12px">
          <div class="flbl">RPE (6–10)</div>
          <div class="rpe-row">${[6,7,8,9,10].map(v=>`<button class="rpebtn btn" onclick="setRpe('${v}')" style="background:${rpe===String(v)?m.dayColor+"33":"#161616"};border:1px solid ${rpe===String(v)?m.dayColor+"55":"#1E1E1E"};color:${rpe===String(v)?m.dayAccent:"#555"}">${v}</button>`).join("")}</div>
        </div>
        <div style="margin-bottom:16px">
          <div class="flbl">ANOTACIÓN</div>
          <textarea id="note-inp" class="noteinput" rows="3" placeholder="Subí 2.5kg, último set al fallo...">${note}</textarea>
        </div>
        <button class="savebtn btn" onclick="saveEntry()" style="background:${S.saved?"#1A3A1A":m.dayColor+"22"};color:${S.saved?"#4A9A4A":m.dayAccent};border:1px solid ${S.saved?"#2A5A2A":m.dayColor+"44"}">${S.saved?"✓ GUARDADO":"GUARDAR"}</button>
      </div>
    </div>
  </div>`;
}

// ─── GUIDE MODAL ──────────────────────────────────────────────
function renderGuideModal(m){
  const g=GUIDES[m.ex.guide];if(!g)return"";
  return`<div class="overlay">
    <div class="panel" style="border-color:${m.dayColor}38">
      <div class="phdr">
        <div>
          <div style="font-size:8px;letter-spacing:3px;color:#3A3A3A;margin-bottom:2px">${m.ex.muscle||""}</div>
          <div style="font-family:'Bebas Neue',sans-serif;font-size:20px;color:${m.dayAccent};letter-spacing:1px;line-height:1">${m.ex.name}</div>
        </div>
        <button class="xbtn" onclick="closeModal()">×</button>
      </div>
      <div class="pbody">
        <div style="margin-bottom:12px">
          <div class="slbl">MÚSCULOS</div>
          <div style="display:flex;flex-wrap:wrap;gap:5px">${g.muscles.map((mu,i)=>`<span class="mstag" style="background:${i===0?m.dayColor+"20":"#181818"};color:${i===0?m.dayAccent:"#555"};border:1px solid ${i===0?m.dayColor+"38":"#242424"}">${mu}</span>`).join("")}</div>
        </div>
        <div style="background:#161616;border-radius:8px;padding:11px 13px;margin-bottom:12px;border-left:3px solid ${m.dayColor}">
          <div class="slbl" style="margin-bottom:5px">POSICIÓN INICIAL</div>
          <div style="font-size:11px;color:#999;line-height:1.7">${g.setup}</div>
        </div>
        <div style="margin-bottom:12px">
          <div class="slbl" style="margin-bottom:8px">EJECUCIÓN</div>
          ${g.execution.map((s,i)=>`<div class="steprow"><div style="display:flex;gap:7px;align-items:flex-start"><span class="stepnum" style="background:${m.dayColor}1E;color:${m.dayAccent}">${i+1}</span><span style="font-size:11px;color:#B0B0B0;line-height:1.6">${s}</span></div></div>`).join("")}
        </div>
        <div style="background:#150000;border:1px solid #3A0F0F;border-radius:8px;padding:11px 13px;margin-bottom:12px">
          <div style="font-size:8px;letter-spacing:3px;color:#4A1818;margin-bottom:7px">⚠ ERRORES</div>
          ${g.errors.map((e,i)=>`<div style="font-size:11px;color:#B86060;line-height:1.6;${i<g.errors.length-1?"padding-bottom:5px;margin-bottom:5px;border-bottom:1px solid #280E0E":""}">— ${e}</div>`).join("")}
        </div>
        <div style="background:#001410;border:1px solid #0E3828;border-radius:8px;padding:10px 13px;margin-bottom:14px;display:flex;gap:9px;align-items:center">
          <div style="font-size:18px">🌬</div>
          <div><div style="font-size:8px;letter-spacing:3px;color:#1A4A38;margin-bottom:3px">RESPIRACIÓN</div><div style="font-size:11px;color:#4A9A78;line-height:1.5">${g.breathing}</div></div>
        </div>
        <button class="btn" onclick="closeModal()" style="width:100%;padding:10px;background:transparent;color:#444;border:1px solid #1E1E1E;border-radius:6px;font-size:9px;letter-spacing:3px;font-family:'DM Mono',monospace">← VOLVER</button>
      </div>
    </div>
  </div>`;
}

// ─── REPLACE / ADD MODAL ──────────────────────────────────────
function renderReplaceModal(){
  const search=(S.dbSearch||"").toLowerCase();
  const filt=S.dbFilter;
  const isAdd=(S.replaceIdx>=S.days[S.replaceDayId].exercises.length);
  const filtered=DB.filter(e=>{
    const matchM=filt==="ALL"||e.muscle===filt;
    const matchS=!search||(e.name.toLowerCase().includes(search)||e.muscle.toLowerCase().includes(search));
    return matchM&&matchS;
  });
  const grouped={};
  filtered.forEach(e=>{if(!grouped[e.muscle])grouped[e.muscle]=[];grouped[e.muscle].push(e);});
  const day=S.days[S.replaceDayId];

  return`<div class="overlay-full">
    <div class="panel-full">
      <div class="phdr-full">
        <div>
          <div style="font-size:8px;letter-spacing:3px;color:#3A3A3A;margin-bottom:2px">${isAdd?"AÑADIR A":"REEMPLAZAR EN"} ${day.day}</div>
          <div style="font-family:'Bebas Neue',sans-serif;font-size:18px;color:#34D399;letter-spacing:1px;line-height:1">
            ${isAdd?"ELEGIR EJERCICIO":`REEMPLAZAR: ${dbGet(day.exercises[S.replaceIdx]).name.toUpperCase()}`}
          </div>
        </div>
        <button class="xbtn" onclick="closeModal()">×</button>
      </div>
      <div style="padding:10px 14px 0;flex-shrink:0">
        <input class="searchbox" id="db-search" type="text" placeholder="🔍  Buscar ejercicio..." oninput="dbSearchInput()" value="${S.dbSearch||""}">
        <div class="filter-row">
          <span class="fpill ${filt==="ALL"?"active":""}" onclick="setDbFilter('ALL')">TODOS</span>
          ${DB_MUSCLES.map(m=>`<span class="fpill ${filt===m?"active":""}" onclick="setDbFilter('${m}')">${m.toUpperCase()}</span>`).join("")}
        </div>
      </div>
      <div class="pbody-full">
        ${filtered.length===0?`<div style="text-align:center;padding:30px;color:#444;font-size:11px">Sin resultados</div>`:""}
        ${Object.keys(grouped).map(muscle=>`
          <div class="db-group">
            <div class="db-group-lbl">${muscle.toUpperCase()}</div>
            ${grouped[muscle].map(ex=>{
              const already=day.exercises.includes(ex.id);
              const tColor=ex.type==="compound"?"#FF6B4A":ex.type==="core"?"#777":"#3A8A8A";
              const action=isAdd?`addExerciseToDay(${day.id},'${ex.id}')`:already?``:`confirmReplace('${ex.id}')`;
              return`<div class="db-ex-item${already?" selected":""}" onclick="${action&&!already?action:""}" style="${already?"opacity:0.5;cursor:default;":""}">
                <span class="db-ex-type" style="color:${tColor}">${ex.type==="compound"?"COMP.":ex.type==="core"?"CORE":"AISLA."}</span>
                <div style="flex:1;min-width:0">
                  <div class="db-ex-name">${ex.name}</div>
                  <div class="db-ex-muscle">${ex.muscle} · ${ex.sets}×${ex.reps}</div>
                </div>
                ${already?`<span style="font-size:8px;color:#34D399;background:#0D1A14;border:1px solid #34D39944;padding:2px 5px;border-radius:3px;flex-shrink:0">YA ESTÁ</span>`:
                  `<span style="font-size:11px;color:#34D399;flex-shrink:0">+</span>`}
              </div>`;
            }).join("")}
          </div>`).join("")}
      </div>
    </div>
  </div>`;
}

function openDbGuide(id){
  const ex=DB.find(e=>e.id===id);
  if(!ex||!ex.guide||!GUIDES[ex.guide])return;
  S.modal={type:"guide",ex,dayColor:"#059669",dayAccent:"#34D399"};render();
}

// ─── INIT ─────────────────────────────────────────────────────
render();
</script></body></html>
